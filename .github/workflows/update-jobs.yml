name: Refresh Texas job feed

on:
  schedule:
    # Runs every 10 hours (00:00, 10:00, 20:00 UTC)
    - cron: "0 */10 * * *"
  workflow_dispatch: {}   # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest Texas jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python scripts/fetch_jobs.py

      - name: Commit updated job feed
        run: |
          git config user.name "texas-job-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --quiet --cached || git commit -m "Auto-refresh Texas job feed [skip ci]"
          git push
